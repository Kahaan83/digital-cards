<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Banshi Saboo</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f2f2f2;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;
      background:white;
      border-radius:28px;
      padding:40px;
      box-shadow:0 10px 35px rgba(0,0,0,0.08);
    }

    .doctor-name{
      font-size:42px;
      font-weight:700;
      color:#2c3e50;
      margin-bottom:35px;
      line-height:1.2;
    }

    .download-btn{
      width:100%;
      border:none;
      background:linear-gradient(135deg,#6C63FF,#7C4DFF);
      color:white;
      padding:22px;
      border-radius:18px;
      font-size:32px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
      margin-bottom:40px;
      box-shadow:0 8px 25px rgba(108,99,255,0.35);
    }

    .download-btn:hover{
      transform:translateY(-3px);
    }

    .section{
      margin-bottom:35px;
    }

    .label{
      font-size:20px;
      color:#9e9e9e;
      margin-bottom:10px;
      font-weight:500;
    }

    .value{
      font-size:22px;
      color:#8e24aa;
      line-height:1.8;
      word-break:break-word;
    }

    .value a{
      color:#8e24aa;
      text-decoration:none;
    }

    .value a:hover{
      text-decoration:underline;
    }

    @media(max-width:600px){

      .card{
        padding:28px;
      }

      .doctor-name{
        font-size:32px;
      }

      .download-btn{
        font-size:24px;
        padding:18px;
      }

      .value{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="doctor-name">
      Dr. Banshi Saboo
    </div>

    <button class="download-btn" onclick="downloadVCard()">
      Download vCard
    </button>

    <div class="section">
      <div class="label">Phone</div>
      <div class="value">
        <a href="tel:+919824047676">
          +919824047676
        </a>
      </div>
    </div>

    <div class="section">
      <div class="label">Work Phone</div>

      <div class="value">
        <a href="tel:+9179263041048104">
          +9179263041048104
        </a>
      </div>

      <div class="value">
        <a href="tel:+917926302104">
          +917926302104
        </a>
      </div>
    </div>

    <div class="section">
      <div class="label">Email</div>

      <div class="value">
        <a href="mailto:banshisaboo@hotmail.com">
          banshisaboo@hotmail.com
        </a>
      </div>
    </div>

  </div>

<script>

function downloadVCard() {

const vCardData =
`BEGIN:VCARD
VERSION:3.0
FN:Dr. Banshi Saboo
TEL;TYPE=CELL:+449824047676
TEL;TYPE=WORK:+4479263041048104
TEL;TYPE=WORK:+447926302104
EMAIL:banshisaboo@hotmail.com
END:VCARD`;

const blob = new Blob([vCardData], { type: 'text/vcard' });

const link = document.createElement('a');

link.href = window.URL.createObjectURL(blob);

link.download = 'Dr_Banshi_Saboo.vcf';

document.body.appendChild(link);

link.click();

document.body.removeChild(link);
}

</script>

</body>
</html>
